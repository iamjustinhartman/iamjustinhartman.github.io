#baseURL = "https://justhart.com/"
baseURL = "https://iamjustinhartman.github.io/"
title = "Justin Hartman"
theme = "PaperMod"
enableRobotsTXT = true

# [params.homeInfoParams]
#   Title = "Hi there wave"
#   Content = "Can be Info, links, about..."
# [params.homeInfoParams.socialIcons.linkedin]
